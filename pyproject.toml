[project]
name = "wikisearch"
version = "0.1.0"
description = "Search engine over the Italian Wikinews dump, with an evaluation of its design choices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elasticsearch>=9,<10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2",
    "sentence-transformers>=3",
    "selectolax>=0.3",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikisearch", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

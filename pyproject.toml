[project]
name = "wikisearch"
version = "0.1.0"
description = "Search engine over the Italian Wikinews dump, with an evaluation of its design choices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "elasticsearch>=9,<10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=2",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikisearch", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

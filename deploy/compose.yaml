# Public demo on a Linux server with Docker: see deploy/README.md.
#   DOMAIN=<host name of the server> docker compose -f deploy/compose.yaml up -d --build
# The app container holds Elasticsearch (127.0.0.1 inside it) and the web app (7860, not published);
# Caddy is the only service reachable from outside: ports 80 and 443, HTTPS certificate from
# Let's Encrypt, obtained and renewed by itself.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN, the public host name of the server}
    command: caddy reverse-proxy --from ${DOMAIN} --to app:7860
    volumes:
      - caddy_data:/data

volumes:
  caddy_data:

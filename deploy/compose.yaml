# Public demo on a server (e.g. an Oracle Cloud Always Free ARM machine): see deploy/README.md.
#   DOMAIN=<public-ip-with-dashes>.sslip.io docker compose -f deploy/compose.yaml up -d --build
# The app container holds Elasticsearch (127.0.0.1 inside it) and the web app (7860, not published);
# Caddy is the only service reachable from outside: ports 80 and 443, HTTPS certificate from
# Let's Encrypt, obtained and renewed by itself.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REF: ${REF:-main}
    restart: unless-stopped
    mem_limit: 4g

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN, e.g. 1-2-3-4.sslip.io}
    command: caddy reverse-proxy --from ${DOMAIN} --to app:7860
    volumes:
      - caddy_data:/data

volumes:
  caddy_data:
